<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnab Ghosh | Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none;
}

/* 🌌 BACKGROUND */
body {
    font-family:Arial;
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

/* 🖱️ CUSTOM CURSOR */
.cursor {
    width:20px;
    height:20px;
    border:2px solid #ffcc00;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
}

/* NAVBAR */
nav {
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    padding:10px 20px;
    border-radius:30px;
    z-index:1000;
}

/* HEADER */
header {
    text-align:center;
    padding:120px 20px;
}

/* SECTIONS */
section {
    padding:80px 20px;
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}

section.show {
    opacity:1;
    transform:translateY(0);
}

/* CARDS */
.card {
    background:rgba(255,255,255,0.1);
    padding:20px;
    margin:20px auto;
    border-radius:15px;
    width:90%;
    backdrop-filter:blur(10px);
}

/* BUTTON */
.btn {
    padding:10px 15px;
    border-radius:20px;
    background:#ff5733;
    color:white;
    text-decoration:none;
}

/* CHATBOT */
#chat {
    position:fixed;
    bottom:20px;
    right:20px;
    width:250px;
    background:#1e293b;
    border-radius:10px;
    padding:10px;
}

#messages {
    height:150px;
    overflow:auto;
    font-size:12px;
}

input {
    width:100%;
    padding:5px;
}
</style>
</head>

<body>

<div class="cursor"></div>

<nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
</nav>

<header>
    <h1>Arnab Ghosh</h1>
    <p>🚀 Developer | Programmer | Problem Solver</p>
</header>

<section id="about">
    <div class="card">Computer Science student building future tech.</div>
</section>

<section id="projects">
    <div class="card">
        <h3>Tic Tac Toe</h3>
        <a href="#" class="btn">Live</a>
    </div>
</section>

<section id="contact">
    <div class="card">
        <p>Email: ghosharnab436@gmail.com</p>
    </div>
</section>

<!-- 🤖 CHATBOT -->
<div id="chat">
    <div id="messages"></div>
    <input type="text" placeholder="Ask me..." onkeydown="chat(event)">
</div>

<script>
/* CURSOR */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

/* SCROLL ANIMATION */
window.addEventListener("scroll",()=>{
document.querySelectorAll("section").forEach(sec=>{
if(sec.getBoundingClientRect().top<window.innerHeight-100){
sec.classList.add("show");
}
});
});

/* CHATBOT */
function chat(e){
if(e.key==="Enter"){
let msg=e.target.value;
let box=document.getElementById("messages");
box.innerHTML+="<p>You: "+msg+"</p>";

let reply="I am Arnab's portfolio bot 🤖";

if(msg.includes("project")) reply="Check my projects above!";
if(msg.includes("contact")) reply="Email: ghosharnab436@gmail.com";

box.innerHTML+="<p>Bot: "+reply+"</p>";
e.target.value="";
}
}
</script>

</body>
</html>
